version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./knowflow.db
      - EMBEDDING_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/knowflow.db:/app/knowflow.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
